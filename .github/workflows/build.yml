name: Build & release

# Construit l'image DevBox (amd64 + arm64 sur runners natifs), la publie sur GHCR
# et crée une release GitHub (+ tag :latest) quand quelque chose a changé.
# Voir README.md, section « Mise à jour automatique ».

on:
  push:
    branches: [main]
    paths: ['image/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['image/**', '.github/workflows/build.yml']
  schedule:
    - cron: '0 4 * * 1' # lundi 04:00 UTC : reconstruction hebdo sans cache
  workflow_dispatch:
    inputs:
      force_release:
        description: Publier une release même si aucune version n'a changé
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Nom de l'image (GHCR exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' & push (par digest)' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/${{ matrix.arch }}
          pull: true
          # Les outils sont téléchargés en « latest » : hors push/PR on reconstruit sans cache
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,name=devbox:test' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}

      # Bloque la PR (et donc la fusion automatique Renovate) si un outil manque ou ne se charge pas
      - name: Test de fumée (${{ matrix.arch }})
        run: |
          ref='${{ github.event_name == 'pull_request' && 'devbox:test' || format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) }}'
          docker run --rm "$ref" devbox-versions
          # Import des modules avec l'utilisateur non-root, comme sur le poste
          docker run --rm --user dev "$ref" pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            Import-Module Az.Accounts, Microsoft.Graph.Authentication, ExchangeOnlineManagement, MicrosoftTeams, PnP.PowerShell
            "Modules importés"'

      - name: Exporter le digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # création de la release
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Manifest multi-arch (:edge + :sha-…)
        id: manifest
        working-directory: /tmp/digests
        run: |
          tag="sha-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.description=Container WSL (wslc) pour l'administration Azure / Microsoft 365" \
            -t "${IMAGE}:${tag}" -t "${IMAGE}:edge" \
            $(printf "${IMAGE}@sha256:%s " *)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Inventaire des versions
        run: |
          docker run --rm "${IMAGE}:${{ steps.manifest.outputs.tag }}" devbox-versions > versions.json
          cat versions.json

      - name: Comparer avec la dernière release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            gh release download "$previous" -p versions.json -O previous.json
          else
            echo '{}' > previous.json
          fi

          reason=""
          if [ -z "$previous" ]; then reason="première release"
          elif [ "${{ github.event_name }}" = "push" ]; then reason="définition de l'image modifiée"
          elif [ "${{ inputs.force_release }}" = "true" ]; then reason="release forcée"
          elif ! diff -q <(jq -S . previous.json) <(jq -S . versions.json) > /dev/null; then reason="nouvelles versions détectées"
          fi
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

          if [ -n "$reason" ]; then status="**${reason}**"
          else status="aucune (rien n'a changé, seul :edge est mis à jour)"
          fi
          {
            echo "## DevBox ${GITHUB_SHA::7}"
            echo
            echo "Release : ${status}"
            echo
            echo "| Composant | Version | ${previous:-Précédente} |"
            echo "|---|---|---|"
            jq -r --slurpfile p previous.json 'to_entries[] |
              ($p[0][.key] // "—") as $old |
              if $old == .value then "| \(.key) | \(.value) | = |"
              else "| **\(.key)** | **\(.value)** | \($old) |" end' versions.json
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier :latest et la release
        if: steps.diff.outputs.reason != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="v$(date -u +%Y.%m.%d)"
          if gh release view "$release" > /dev/null 2>&1; then release="${release}.${GITHUB_RUN_NUMBER}"; fi

          docker buildx imagetools create \
            -t "${IMAGE}:latest" -t "${IMAGE}:${release}" \
            "${IMAGE}:${{ steps.manifest.outputs.tag }}"

          {
            echo
            echo "Image : \`${IMAGE}:${release}\` (aussi \`:latest\`)"
            echo
            echo "Les postes équipés de la tâche planifiée se mettent à jour automatiquement."
            echo "Mise à jour immédiate : \`.\\scripts\\Update-DevBox.ps1\`"
          } >> notes.md

          gh release create "$release" versions.json \
            --target "$GITHUB_SHA" \
            --title "DevBox ${release}" \
            --notes-file notes.md
